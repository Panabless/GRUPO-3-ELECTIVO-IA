<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Monitor de combustible · Prototipo Equipo 3</title>
<style>
  /* Sistema mínimo: texto 24 px (títulos y cifras) y 16 px (contenido) · acción #1D4ED8 · alerta #B42318 · espaciado 8 px */
  :root {
    --accion: #1D4ED8; --accion-suave: #E8EEFC;
    --alerta: #B42318; --alerta-suave: #FDECEA;
    --tinta: #1F2937; --gris: #4B5563; --linea: #D1D5DB; --fondo: #F6F7F9; --blanco: #FFFFFF;
    --t-grande: 24px; --t-base: 16px; --u: 8px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--tinta); font: var(--t-base)/1.5 system-ui, "Segoe UI", Roboto, Arial, sans-serif; }
  button, select, input { font: inherit; }
  .app { max-width: 760px; margin: 0 auto; padding: calc(var(--u)*2); padding-bottom: calc(var(--u)*12); }

  /* encabezado: ¿dónde estoy? / ¿cómo vuelvo? */
  .cab { display: flex; align-items: center; justify-content: space-between; gap: var(--u); margin-bottom: calc(var(--u)*2); flex-wrap: wrap; }
  .migas { display: flex; align-items: center; gap: var(--u); flex-wrap: wrap; color: var(--gris); }
  .migas a { color: var(--accion); text-decoration: underline; }
  .migas .aqui { color: var(--tinta); font-weight: 700; }
  .hu { border: 1px solid var(--gris); border-radius: 999px; padding: 0 var(--u); color: var(--gris); white-space: nowrap; }
  h1 { font-size: var(--t-grande); line-height: 1.25; margin: 0 0 calc(var(--u)*2); }
  h2 { font-size: var(--t-base); margin: calc(var(--u)*3) 0 var(--u); text-transform: uppercase; letter-spacing: .04em; color: var(--gris); }

  .volver { display: inline-flex; align-items: center; gap: var(--u); min-height: 44px; padding: 0 calc(var(--u)*2); border: 1px solid var(--linea); border-radius: var(--u); background: var(--blanco); color: var(--tinta); cursor: pointer; }
  .btn { min-height: 48px; padding: 0 calc(var(--u)*3); border-radius: var(--u); border: 2px solid var(--accion); background: var(--accion); color: #fff; font-weight: 700; cursor: pointer; }
  .btn.sec { background: var(--blanco); color: var(--accion); }
  .btn:disabled { opacity: .6; cursor: progress; }
  .acciones { display: flex; gap: calc(var(--u)*2); flex-wrap: wrap; margin-top: calc(var(--u)*3); }
  :focus-visible { outline: 3px solid var(--accion); outline-offset: 2px; }

  .tarjeta { background: var(--blanco); border: 1px solid var(--linea); border-radius: calc(var(--u)*1.5); padding: calc(var(--u)*2); }

  /* cifras destacadas */
  .cifras { display: grid; grid-template-columns: repeat(3, 1fr); gap: calc(var(--u)*2); }
  .cifra { background: var(--blanco); border: 1px solid var(--linea); border-radius: calc(var(--u)*1.5); padding: calc(var(--u)*2); }
  .cifra b { display: block; font-size: var(--t-grande); }
  .cifra.alerta b { color: var(--alerta); }

  /* lista de camiones */
  .lista { list-style: none; margin: 0; padding: 0; background: var(--blanco); border: 1px solid var(--linea); border-radius: calc(var(--u)*1.5); overflow: hidden; }
  .lista li + li { border-top: 1px solid var(--linea); }
  .fila { width: 100%; display: grid; grid-template-columns: 1fr 80px 150px 24px; align-items: center; gap: var(--u); min-height: 56px; padding: var(--u) calc(var(--u)*2); background: none; border: 0; text-align: left; cursor: pointer; color: inherit; }
  .fila:hover { background: var(--accion-suave); }
  .fila .id { font-weight: 700; }
  .fila .ir { color: var(--gris); text-align: right; }
  .aviso { grid-column: 1 / -1; display: flex; gap: var(--u); color: var(--alerta); }

  /* estados: siempre texto + color */
  .estado { display: inline-block; border-radius: 999px; padding: 0 var(--u); border: 1.5px solid; font-weight: 700; white-space: nowrap; justify-self: start; }
  .estado.critico { color: var(--alerta); border-color: var(--alerta); background: var(--alerta-suave); }
  .estado.sin_senal { color: var(--tinta); border-color: var(--tinta); border-style: dashed; background: var(--blanco); }
  .estado.en_proceso { color: var(--accion); border-color: var(--accion); background: var(--accion-suave); }
  .estado.normal { color: var(--gris); border-color: var(--linea); }
  .estado.abastecido, .estado.cerrada { color: var(--tinta); border-color: var(--tinta); }

  .resto { margin-top: calc(var(--u)*2); color: var(--gris); }

  /* estados de pantalla */
  .estado-pantalla { text-align: center; padding: calc(var(--u)*5) calc(var(--u)*2); }
  .estado-pantalla p { margin: var(--u) 0 0; color: var(--gris); }
  .girando { width: 32px; height: 32px; border: 4px solid var(--linea); border-top-color: var(--accion); border-radius: 50%; margin: 0 auto; animation: g 1s linear infinite; }
  @keyframes g { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .girando { animation: none; } }
  .error-caja { border: 2px solid var(--alerta); background: var(--alerta-suave); border-radius: calc(var(--u)*1.5); padding: calc(var(--u)*2); }
  .error-caja b { color: var(--alerta); }

  /* detalle */
  .grande { display: flex; align-items: baseline; gap: calc(var(--u)*2); }
  .grande b { font-size: var(--t-grande); }
  .pares { display: grid; grid-template-columns: 1fr 1fr; gap: calc(var(--u)*2); margin-top: calc(var(--u)*2); }
  .par span { display: block; color: var(--gris); }
  .par b { display: block; }
  table { width: 100%; border-collapse: collapse; background: var(--blanco); border: 1px solid var(--linea); border-radius: calc(var(--u)*1.5); overflow: hidden; }
  th, td { text-align: left; padding: var(--u) calc(var(--u)*2); border-top: 1px solid var(--linea); }
  th { color: var(--gris); font-weight: 700; border-top: 0; }

  /* formulario */
  .campo { margin-bottom: calc(var(--u)*3); }
  .campo label { display: block; font-weight: 700; margin-bottom: var(--u); }
  .campo select, .campo input { width: 100%; min-height: 48px; padding: 0 calc(var(--u)*1.5); border: 1.5px solid var(--gris); border-radius: var(--u); background: var(--blanco); color: var(--tinta); }
  .campo input[readonly] { background: var(--fondo); border-color: var(--linea); }
  .campo.con-error select { border-color: var(--alerta); border-width: 2px; }
  .msg-error { color: var(--alerta); margin-top: var(--u); display: flex; gap: var(--u); }
  .ayuda { color: var(--gris); margin-top: var(--u); }

  /* confirmación */
  .ok { display: flex; align-items: center; gap: calc(var(--u)*2); }
  .ok .check { width: 48px; height: 48px; border-radius: 50%; border: 3px solid var(--accion); color: var(--accion); display: grid; place-items: center; font-size: var(--t-grande); font-weight: 700; }

  .aviso-toast { background: var(--tinta); color: #fff; border-radius: var(--u); padding: var(--u) calc(var(--u)*2); margin-bottom: calc(var(--u)*2); }

  /* panel para la revisión del prototipo (no es parte de la app) */
  .demo { position: fixed; left: 0; right: 0; bottom: 0; background: var(--blanco); border-top: 1px solid var(--linea); padding: var(--u) calc(var(--u)*2); display: flex; gap: var(--u); align-items: center; flex-wrap: wrap; justify-content: center; }
  .demo span { color: var(--gris); }
  .demo button { min-height: 44px; padding: 0 calc(var(--u)*1.5); border: 1px solid var(--linea); background: var(--blanco); border-radius: var(--u); cursor: pointer; color: var(--tinta); }
  .demo button[aria-pressed="true"] { border-color: var(--accion); color: var(--accion); font-weight: 700; }

  @media (max-width: 560px) {
    .demo { position: static; margin-top: calc(var(--u)*2); }
    .app { padding-bottom: calc(var(--u)*2); }
    .cifras { grid-template-columns: 1fr; }
    .fila { grid-template-columns: 1fr 64px 120px 16px; }
    .pares { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<main class="app" id="app" aria-live="polite"></main>

<div class="demo" role="group" aria-label="Controles de revisión del prototipo">
  <span>Revisión del prototipo · Monitor:</span>
  <button type="button" data-modo="datos" aria-pressed="true">Con datos</button>
  <button type="button" data-modo="vacio" aria-pressed="false">Vacío</button>
  <button type="button" data-modo="cargando" aria-pressed="false">Cargando</button>
  <button type="button" data-modo="error" aria-pressed="false">Sin conexión</button>
  <button type="button" data-reiniciar>Reiniciar</button>
</div>

<script>
/* ---------- datos de ejemplo (nombres de campos según docs/datos/estructura_datos.md) ---------- */
const SECTORES = [
  { id_sector: 'SEC-A', nombre: 'Sector A' }, { id_sector: 'SEC-B', nombre: 'Sector B' },
  { id_sector: 'SEC-C', nombre: 'Sector C' }, { id_sector: 'SEC-D', nombre: 'Sector D' }
];
const CARROS = [ // CARRO, con su operador (USUARIO con rol operador)
  { id_carro: 'CAR-01', nombre: 'Camión de combustible 1', operador: 'Operador camión de combustible A', estado: 'disponible' },
  { id_carro: 'CAR-02', nombre: 'Camión de combustible 2', operador: 'Operador camión de combustible B', estado: 'fuera_de_servicio' }
];
const NORMALES_FUERA_DE_LISTA = 28;

function datosIniciales() {
  return {
    camiones: [
      { id_camion: 'CAM-07', nivel_combustible: 12, estado: 'critico', ultimo_abastecimiento: '2026-09-30 21:10',
        alertas: [{ creada_en: '2026-10-01 09:42', nivel_detectado: 12 }, { creada_en: '2026-09-30 19:55', nivel_detectado: 14 }] },
      { id_camion: 'CAM-12', nivel_combustible: 13, estado: 'critico', ultimo_abastecimiento: '2026-09-30 18:40',
        alertas: [{ creada_en: '2026-10-01 09:50', nivel_detectado: 13 }] },
      { id_camion: 'CAM-21', nivel_combustible: 40, estado: 'sin_senal', ultimo_abastecimiento: '2026-09-30 23:05', alertas: [] },
      { id_camion: 'CAM-19', nivel_combustible: 14, estado: 'en_proceso', ultimo_abastecimiento: '2026-09-30 20:30',
        alertas: [{ creada_en: '2026-10-01 09:44', nivel_detectado: 14 }] }
    ],
    ordenes: [ { id_orden: 'ORD-002', id_camion: 'CAM-19', sector: 'Sector A', carro: 'Camión de combustible 1 · Operador camión de combustible A', emitida_en: '2026-10-01 09:48', estado: 'en_proceso', cerrada_en: null } ],
    siguiente: 3,
    aviso: null
  };
}
let S = datosIniciales();
let modo = 'datos';           // datos | vacio | cargando | error (solo para la revisión)
let primeraCarga = true;

const ETIQUETA = { critico: 'Crítico', sin_senal: 'Sin señal', en_proceso: 'En proceso', normal: 'Normal', abastecido: 'Abastecido', cerrada: 'Cerrada' };
const $app = document.getElementById('app');
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const ahora = () => { const d = new Date(); return '2026-10-01 ' + String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); };
const nivelTxt = c => c.estado === 'sin_senal' ? c.nivel_combustible + ' % (no confiable)' : c.nivel_combustible + ' %';
const chip = e => `<span class="estado ${e}">${ETIQUETA[e]}</span>`;
const camion = id => S.camiones.find(c => c.id_camion === id);
const ir = h => { location.hash = h; };

function cabecera(migas, hu, volver) {
  const partes = migas.map((m, i) => i < migas.length - 1 ? `<a href="${m[1]}">${esc(m[0])}</a><span aria-hidden="true">›</span>` : `<span class="aqui" aria-current="page">${esc(m[0])}</span>`).join(' ');
  return `<div class="cab">
    <nav class="migas" aria-label="Dónde estoy">${partes}</nav>
    <div style="display:flex;gap:8px;align-items:center">${hu.map(h => `<span class="hu">${h}</span>`).join('')}
      ${volver ? `<button class="volver" type="button" data-ir="${volver[1]}">‹ ${esc(volver[0])}</button>` : ''}</div>
  </div>`;
}

/* ---------- P1 · Monitor de flota (HU-01, HU-03) ---------- */
function pantallaMonitor() {
  const cab = cabecera([['Monitor de flota', '#monitor']], ['HU-01', 'HU-03'], null);
  if (modo === 'cargando' || primeraCarga) {
    $app.innerHTML = cab + `<h1>Monitor de flota</h1><div class="tarjeta estado-pantalla"><div class="girando" aria-hidden="true"></div><p>Cargando lecturas de combustible…</p></div>`;
    if (primeraCarga && modo === 'datos') setTimeout(() => { primeraCarga = false; render(); }, 900);
    return;
  }
  if (modo === 'error') {
    $app.innerHTML = cab + `<h1>Monitor de flota</h1><div class="error-caja" role="alert"><b>No se pudieron cargar las lecturas.</b><p>Revise la conexión de red y vuelva a intentar. Mientras tanto, no tome decisiones con datos antiguos.</p>
      <button class="btn" type="button" data-reintentar>Reintentar</button></div>`;
    return;
  }
  const atencion = modo === 'vacio' ? [] : S.camiones.filter(c => c.estado === 'critico' || c.estado === 'sin_senal')
    .sort((a, b) => a.nivel_combustible - b.nivel_combustible);
  const enCurso = modo === 'vacio' ? [] : S.camiones.filter(c => c.estado === 'en_proceso');
  const criticos = atencion.filter(c => c.estado === 'critico').length;
  const sinSenal = atencion.filter(c => c.estado === 'sin_senal').length;
  const abastecidos = modo === 'vacio' ? [] : S.camiones.filter(c => c.estado === 'abastecido');

  const fila = c => `<li><button class="fila" type="button" data-ir="#detalle/${c.id_camion}" aria-label="${c.id_camion}, ${nivelTxt(c)}, ${ETIQUETA[c.estado]}. Ver detalle">
      <span class="id">${c.id_camion}</span><span>${c.estado === 'sin_senal' ? '¿' + c.nivel_combustible + ' %?' : c.nivel_combustible + ' %'}</span>${chip(c.estado)}<span class="ir" aria-hidden="true">›</span>
      ${c.estado === 'sin_senal' ? `<span class="aviso"><span aria-hidden="true">⚠</span><span>Dato no confiable o insuficiente. Verificar en terreno antes de decidir.</span></span>` : ''}
    </button></li>`;

  $app.innerHTML = cab + (S.aviso ? `<div class="aviso-toast" role="status">${esc(S.aviso)}</div>` : '') + `
    <h1>Monitor de flota</h1>
    <div class="cifras">
      <div class="cifra alerta"><b>${criticos}</b>críticos (bajo 15 %)</div>
      <div class="cifra"><b>${sinSenal}</b>sin señal</div>
      <div class="cifra"><b>${enCurso.length}</b>órdenes en proceso</div>
    </div>
    <h2>Requieren atención</h2>
    ${atencion.length ? `<ul class="lista">${atencion.map(fila).join('')}</ul>`
      : `<div class="tarjeta estado-pantalla"><b>Ningún camión requiere atención.</b><p>Todos los camiones con lectura están sobre el 15 %. Esta vista se actualiza con cada lectura.</p></div>`}
    <h2>En curso</h2>
    ${enCurso.length ? `<ul class="lista">${enCurso.map(fila).join('')}</ul>` : `<div class="tarjeta">No hay órdenes de reabastecimiento en proceso.</div>`}
    ${abastecidos.length ? `<h2>Abastecidos en este turno</h2><ul class="lista">${abastecidos.map(fila).join('')}</ul>` : ''}
    <p class="resto">Resto de la flota: ${modo === 'vacio' ? 32 : NORMALES_FUERA_DE_LISTA} camiones en estado ${chip('normal')}</p>`;
  S.aviso = null;
}

/* ---------- P2 · Detalle del camión (HU-02) ---------- */
function pantallaDetalle(id) {
  const c = camion(id); if (!c) return ir('#monitor');
  const orden = S.ordenes.find(o => o.id_camion === id && o.estado === 'en_proceso');
  $app.innerHTML = cabecera([['Monitor de flota', '#monitor'], [id, '#detalle/' + id]], ['HU-02'], ['Volver al monitor', '#monitor']) + `
    <h1>${id}</h1>
    <div class="tarjeta">
      <div class="grande"><b>${nivelTxt(c)}</b>${chip(c.estado)}</div>
      ${c.estado === 'sin_senal' ? `<p class="msg-error"><span aria-hidden="true">⚠</span><span>El sensor no está reportando. Verifique el camión en terreno antes de asignar una orden.</span></p>` : ''}
      <div class="pares"><div class="par"><span>Último abastecimiento</span><b>${c.ultimo_abastecimiento}</b></div>
      <div class="par"><span>Orden en curso</span><b>${orden ? orden.id_orden : 'Ninguna'}</b></div></div>
    </div>
    <h2>Alertas recientes</h2>
    ${c.alertas.length ? `<table><thead><tr><th>Fecha y hora</th><th>Nivel detectado</th></tr></thead><tbody>${c.alertas.map(a => `<tr><td>${a.creada_en}</td><td>${a.nivel_detectado} %</td></tr>`).join('')}</tbody></table>`
      : `<div class="tarjeta">No hay alertas registradas para este camión.</div>`}
    <p class="ayuda">¿La lectura es coherente con el último abastecimiento? Si lo es, asigne la orden.</p>
    <div class="acciones">
      ${orden ? `<button class="btn" type="button" data-ir="#orden/${orden.id_orden}">Ver orden ${orden.id_orden}</button>`
              : c.estado === 'abastecido' ? '' : `<button class="btn" type="button" data-ir="#asignar/${id}">Asignar orden</button>`}
    </div>`;
}

/* ---------- P3 · Asignar orden (HU-04) ---------- */
let enviando = false, errorEnvio = false;
function pantallaAsignar(id, errores = {}, valores = {}) {
  const c = camion(id); if (!c) return ir('#monitor');
  const opt = (lista, key, sel, ph) => `<option value="">${ph}</option>` + lista.map(x => `<option value="${x[key]}" ${sel === x[key] ? 'selected' : ''}>${esc(x.nombre)}</option>`).join('');
  const optCarro = sel => `<option value="">Elegir camión de combustible…</option>` + CARROS.map(x => x.estado === 'disponible'
    ? `<option value="${x.id_carro}" ${sel === x.id_carro ? 'selected' : ''}>${esc(x.nombre)} · ${esc(x.operador)}</option>`
    : `<option value="${x.id_carro}" disabled>${esc(x.nombre)} · fuera de servicio</option>`).join('');
  $app.innerHTML = cabecera([['Monitor de flota', '#monitor'], [id, '#detalle/' + id], ['Asignar orden', '#asignar/' + id]], ['HU-04'], ['Volver al detalle', '#detalle/' + id]) + `
    <h1>Asignar orden de reabastecimiento</h1>
    ${errorEnvio ? `<div class="error-caja" role="alert" style="margin-bottom:16px"><b>No se pudo registrar la orden.</b><p>Revise la conexión e intente de nuevo. Los datos del formulario se mantienen.</p></div>` : ''}
    <form class="tarjeta" id="form" novalidate>
      <div class="campo"><label for="f-camion">Camión</label><input id="f-camion" value="${id} · ${nivelTxt(c)}" readonly>
        <div class="ayuda">Precargado desde el detalle.</div></div>
      <div class="campo ${errores.sector ? 'con-error' : ''}"><label for="f-sector">Sector de encuentro *</label>
        <select id="f-sector" aria-describedby="e-sector" ${errores.sector ? 'aria-invalid="true"' : ''}>${opt(SECTORES, 'id_sector', valores.sector, 'Elegir sector…')}</select>
        ${errores.sector ? `<div class="msg-error" id="e-sector"><span aria-hidden="true">⚠</span><span>Elija el sector donde el operador se encontrará con el camión.</span></div>` : ''}</div>
      <div class="campo ${errores.carro ? 'con-error' : ''}"><label for="f-carro">Camión de combustible y operador *</label>
        <select id="f-carro" aria-describedby="e-carro" ${errores.carro ? 'aria-invalid="true"' : ''}>${optCarro(valores.carro)}</select>
        ${errores.carro ? `<div class="msg-error" id="e-carro"><span aria-hidden="true">⚠</span><span>Elija el camión de combustible que irá; la orden le llega a su operador.</span></div>` : `<div class="ayuda">Solo se pueden elegir los que están disponibles.</div>`}</div>
      <div class="ayuda">* Obligatorio.</div>
      <div class="acciones">
        <button class="btn" type="submit" ${enviando ? 'disabled' : ''}>${enviando ? 'Registrando orden…' : 'Enviar orden'}</button>
        <button class="btn sec" type="button" data-ir="#detalle/${id}">Cancelar</button>
      </div>
    </form>`;
  document.getElementById('form').addEventListener('submit', ev => {
    ev.preventDefault();
    const v = { sector: document.getElementById('f-sector').value, carro: document.getElementById('f-carro').value };
    const e = { sector: !v.sector, carro: !v.carro };
    if (e.sector || e.carro) { errorEnvio = false; pantallaAsignar(id, e, v); document.querySelector('[aria-invalid="true"]').focus(); return; }
    enviando = true; errorEnvio = false; pantallaAsignar(id, {}, v);
    setTimeout(() => {
      enviando = false;
      if (modo === 'error') { errorEnvio = true; pantallaAsignar(id, {}, v); return; }  // simulación sin conexión
      const id_orden = 'ORD-' + String(S.siguiente++).padStart(3, '0');
      S.ordenes.push({ id_orden, id_camion: id, sector: SECTORES.find(s => s.id_sector === v.sector).nombre,
        carro: (k => k.nombre + ' · ' + k.operador)(CARROS.find(k => k.id_carro === v.carro)), emitida_en: ahora(), estado: 'en_proceso', cerrada_en: null });
      c.estado = 'en_proceso';
      ir('#orden/' + id_orden);
    }, 900);
  });
}

/* ---------- P4 · Orden registrada y cierre (HU-04, HU-05) ---------- */
function pantallaOrden(id_orden) {
  const o = S.ordenes.find(x => x.id_orden === id_orden); if (!o) return ir('#monitor');
  const cerrada = o.estado === 'cerrada';
  $app.innerHTML = cabecera([['Monitor de flota', '#monitor'], [o.id_camion, '#detalle/' + o.id_camion], [id_orden, '#orden/' + id_orden]], ['HU-04', 'HU-05'], ['Volver al monitor', '#monitor']) + `
    <div class="ok"><span class="check" aria-hidden="true">✓</span><h1 style="margin:0">${cerrada ? 'Orden ' + id_orden + ' cerrada' : 'Orden ' + id_orden + ' registrada'}</h1></div>
    <div class="tarjeta" style="margin-top:16px">
      <div class="pares">
        <div class="par"><span>Camión</span><b>${o.id_camion}</b></div>
        <div class="par"><span>Sector de encuentro</span><b>${esc(o.sector)}</b></div>
        <div class="par"><span>Camión de combustible</span><b>${esc(o.carro)}</b></div>
        <div class="par"><span>Emitida</span><b>${o.emitida_en}</b></div>
        <div class="par"><span>Estado de la orden</span><b>${chip(o.estado)}</b></div>
        <div class="par"><span>Cerrada</span><b>${o.cerrada_en || '—'}</b></div>
      </div>
    </div>
    ${cerrada ? `<p class="ayuda">${o.id_camion} quedó en estado «Abastecido» y salió de «Requieren atención». El turno siguiente verá este registro en el monitor.</p>
      <div class="acciones"><button class="btn" type="button" data-ir="#monitor">Volver al monitor</button></div>`
    : `<p class="ayuda">Confirme el cierre cuando el operador del camión de combustible informe que terminó.</p>
      <div class="acciones"><button class="btn" type="button" data-cerrar="${id_orden}">Confirmar cierre</button>
      <button class="btn sec" type="button" data-ir="#monitor">Volver al monitor</button></div>`}`;
}

/* ---------- navegación ---------- */
function render() {
  const [ruta, param] = (location.hash || '#monitor').slice(1).split('/');
  if (ruta !== 'asignar') { enviando = false; errorEnvio = false; }
  if (ruta === 'detalle') pantallaDetalle(param);
  else if (ruta === 'asignar') pantallaAsignar(param);
  else if (ruta === 'orden') pantallaOrden(param);
  else pantallaMonitor();
  window.scrollTo(0, 0);
}
window.addEventListener('hashchange', render);
document.addEventListener('click', ev => {
  const t = ev.target.closest('button'); if (!t) return;
  if (t.dataset.ir) ir(t.dataset.ir);
  if (t.dataset.reintentar !== undefined) { modo = 'datos'; marcarModo(); primeraCarga = true; render(); }
  if (t.dataset.cerrar) {
    const o = S.ordenes.find(x => x.id_orden === t.dataset.cerrar);
    o.estado = 'cerrada'; o.cerrada_en = ahora();
    camion(o.id_camion).estado = 'abastecido'; camion(o.id_camion).nivel_combustible = 96;
    S.aviso = `${o.id_camion} abastecido · orden ${o.id_orden} cerrada a las ${o.cerrada_en.slice(11)}.`;
    pantallaOrden(o.id_orden);
  }
  if (t.dataset.modo) { modo = t.dataset.modo; primeraCarga = false; marcarModo(); if ((location.hash || '#monitor') === '#monitor') render(); else ir('#monitor'); }
  if (t.dataset.reiniciar !== undefined) { S = datosIniciales(); modo = 'datos'; primeraCarga = true; marcarModo(); location.hash === '#monitor' ? render() : ir('#monitor'); }
});
function marcarModo() { document.querySelectorAll('[data-modo]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.modo === modo))); }
render();
</script>
</body>
</html>
